
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANASA | Solicitar una cita</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <h1>LANASA</h1>
        <p>Cuidamos tu vehículo, garantizamos tu tranquilidad.</p>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#servicios">Servicios</a></li>
                <li><a href="index.html#nosotros">Nosotros</a></li>
                <li><a href="citas.html">Solicitar cita</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="formulario">
            <h2>Solicita tu cita</h2>
            <p>
                Completa los siguientes datos para solicitar
                una cita en nuestro centro de servicio automotriz.
            </p>

            <form>

                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Escribe tu nombre">

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono"
                       placeholder="809-000-0000">

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo"
                       placeholder="ejemplo@correo.com">

                <label for="marca">Marca del vehículo:</label>
                <input type="text" id="marca" name="marca"
                       placeholder="Ej. Toyota">

                <label for="modelo">Modelo y año:</label>
                <input type="text" id="modelo" name="modelo"
                       placeholder="Ej. Corolla 2020">

                <label for="servicio">Servicio solicitado:</label>
                <select id="servicio" name="servicio">
                    <option value="">Seleccione un servicio</option>
                    <option>Mantenimiento preventivo</option>
                    <option>Cambio de aceite</option>
                    <option>Diagnóstico computarizado</option>
                    <option>Reparación de frenos</option>
                    <option>Revisión de suspensión</option>
                </select>

                <label for="fecha">Fecha preferida:</label>
                <input type="date" id="fecha" name="fecha">

                <label for="descripcion">Descripción del problema:</label>
                <textarea id="descripcion" name="descripcion"
                          rows="4"
                          placeholder="Describe brevemente lo que necesita tu vehículo"></textarea>

                <button type="button">Solicitar cita</button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 LANASA. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
